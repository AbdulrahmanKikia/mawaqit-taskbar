name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for artifact names (e.g. 0.1.0). Ignored for tag builds."
        required: false
        default: "0.1.0"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build widget (release)
        run: cargo build --release --bin widget

      - name: Stage dist\widget.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Force target\release\widget.exe dist\widget.exe
          Copy-Item -Force assets\icon.ico dist\icon.ico

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -match '^v(.+)$') {
            $v = $Matches[1]
          } else {
            $v = "${{ github.event.inputs.version }}"
            if (-not $v) { $v = "0.1.0" }
          }
          # Keep Inno script version in sync for this build
          $iss = "installer\mawaqit-widget.iss"
          (Get-Content $iss -Raw) -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$v`"" |
            Set-Content $iss -NoNewline
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Version: $v"

      - name: Portable zip
        shell: pwsh
        run: .\scripts\package-portable.ps1

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile Setup.exe
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\mawaqit-widget.iss
          Get-ChildItem dist -File | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mawaqit-widget-windows
          path: |
            dist/MawaqitWidget-Setup-*.exe
            dist/MawaqitWidget-Portable-*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/MawaqitWidget-Setup-*.exe
            dist/MawaqitWidget-Portable-*.zip
          body: |
            ## Install (no programming required)

            1. Download **MawaqitWidget-Setup-*.exe**
            2. Double-click it → Next → Finish
            3. Look for the prayer strip above the taskbar (left)
            4. Right-click → **Change mosque…** to pick your mosque

            If Windows SmartScreen warns you: **More info** → **Run anyway** (the installer is not code-signed yet).

            Alternative: download the **Portable** zip, extract it, double-click **Install.bat**.

            ### Requirements
            - Windows 10/11 (64-bit)
            - Internet
            - [WebView2 Runtime](https://developer.microsoft.com/en-us/microsoft-edge/webview2/) (usually already on Windows 11)
