name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for artifact names (e.g. 0.2.0). Ignored for tag builds."
        required: false
        default: "0.2.0"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Gate: nothing is published unless the tests and house rules pass.
      - name: Tests and house rules
        run: dotnet test tests/Mawaqit.Tests/Mawaqit.Tests.csproj -c Release

      # A tag that does not match the app's own version would make the in-app
      # updater offer the same release forever.
      - name: Tag matches app version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          $app = (Select-String -Path host-winui\Mawaqit.WinUI.csproj -Pattern '<Version>([^<]+)</Version>').Matches[0].Groups[1].Value
          if ($tag -ne $app) { throw "Tag v$tag does not match <Version>$app</Version>. Bump the version (csproj, AppState, installer) first." }

      - name: Publish WinUI host
        run: .\scripts\build-release.ps1

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -match '^v(.+)$') {
            $v = $Matches[1]
          } else {
            $v = "${{ github.event.inputs.version }}"
            if (-not $v) { $v = "0.2.0" }
          }
          $iss = "installer\mawaqit-widget.iss"
          (Get-Content $iss -Raw) -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$v`"" |
            Set-Content $iss -NoNewline
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Version: $v"

      - name: Portable zip
        shell: pwsh
        run: .\scripts\package-portable.ps1

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile Setup.exe
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\mawaqit-widget.iss
          Get-ChildItem dist -File | Format-Table Name, Length

      # The in-app updater checks the installer against GitHub's asset digest,
      # and falls back to these files.
      - name: SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Name -match '^MawaqitWidget-(Setup|Portable)-.*\.(exe|zip)$' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -Path "$($_.FullName).sha256" -Encoding ascii -NoNewline
            Write-Host "$hash  $($_.Name)"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mawaqit-widget-windows
          path: |
            dist/MawaqitWidget-Setup-*.exe
            dist/MawaqitWidget-Portable-*.zip
            dist/MawaqitWidget-*.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/MawaqitWidget-Setup-*.exe
            dist/MawaqitWidget-Portable-*.zip
            dist/MawaqitWidget-*.sha256
          body: |
            ## Install (no programming required)

            1. Download **MawaqitWidget-Setup-*.exe**
            2. Double-click it → Next → Finish
            3. Look for the prayer chip on the taskbar (next to the clock)
            4. Right-click → **Change mosque…** to pick your mosque

            If Windows SmartScreen warns you: **More info** → **Run anyway** (the installer is not code-signed yet).

            Alternative: download the **Portable** zip, extract it, double-click **Install.bat**.

            ### Requirements
            - Windows 11 (64-bit, build 22000+)
            - Internet
            - [WebView2 Runtime](https://developer.microsoft.com/en-us/microsoft-edge/webview2/) (usually already on Windows 11)
            - Windows App SDK 1.5 is **bundled** (self-contained unpackaged WinUI 3 host)

            Taskbar inject host adapted from [Awqat Salaat](https://github.com/Khiro95/Awqat-Salaat) (MIT). Prayer data is Mawaqit, not a fork of Awqat's services.
