# Local host for https://github.com/mrsofiane/mawaqit-api
# Start: docker compose up -d
# API:   http://127.0.0.1:8000

services:
  mawaqit-api:
    image: mrsofiane/mawaqit-api:latest
    ports:
      - "8000:80"
    environment:
      ENABLE_AUTH: "false"
      ENABLE_REDIS: "false"
      RATE_LIMIT: "60/minute"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/api/v1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
