<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Find a mosque</title>
  <link rel="stylesheet" href="/leaflet.css" />
  <style>
    :root {
      --bg: #1c1c1c;
      --panel: #2a2a2a;
      --text: #f3f3f3;
      --muted: #a0a0a0;
      --accent: #ffcd60;
      --line: #3a3a3a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 14px/1.4 system-ui, Segoe UI, sans-serif; }
    #app { display: grid; grid-template-columns: 320px 1fr; height: 100%; }
    #side { display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--panel); min-height: 0; }
    #side header { padding: 14px 16px 8px; flex-shrink: 0; }
    #side header h1 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
    #side header p { margin: 0; color: var(--muted); font-size: 12px; }
    .search-row { display: flex; gap: 8px; padding: 8px 16px 8px; flex-shrink: 0; }
    .search-row input {
      flex: 1; border: 1px solid var(--line); background: #1a1a1a; color: var(--text);
      border-radius: 6px; padding: 8px 10px; outline: none;
    }
    .search-row input:focus { border-color: var(--accent); }
    .search-row button, #useBtn, #locBtn, #refreshBtn {
      border: 0; border-radius: 6px; padding: 8px 12px; cursor: pointer;
      background: var(--accent); color: #1a1200; font-weight: 600;
    }
    #locBtn, #refreshBtn { background: #3a3a3a; color: var(--text); }
    .actions { display: flex; gap: 8px; padding: 0 16px 8px; flex-shrink: 0; }
    .actions button { flex: 1; }
    #status { padding: 0 16px 8px; color: var(--muted); font-size: 12px; min-height: 18px; flex-shrink: 0; }
    #confirm {
      flex-shrink: 0; padding: 10px 16px; border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line); background: #242018;
    }
    #confirm .picked { font-size: 12px; color: var(--muted); margin-bottom: 8px; min-height: 16px; }
    #confirm .picked strong { color: var(--text); font-weight: 600; }
    #useBtn { width: 100%; padding: 12px; }
    #useBtn:disabled { opacity: 0.4; cursor: not-allowed; }
    #list { flex: 1; overflow: auto; padding: 8px 8px 12px; min-height: 0; }
    .item {
      width: 100%; text-align: left; border: 1px solid transparent; background: transparent;
      color: var(--text); border-radius: 8px; padding: 10px; cursor: pointer; margin-bottom: 4px;
    }
    .item:hover { background: #333; }
    .item.active { border-color: var(--accent); background: #3a3420; }
    .item .name { font-weight: 600; margin-bottom: 2px; }
    .item .meta { color: var(--muted); font-size: 12px; }
    #map { height: 100%; background: #111; }
    .name-tag {
      background: var(--accent);
      color: #1a1200;
      border: 0;
      border-radius: 4px;
      padding: 2px 7px;
      font: 600 11px/1.3 system-ui, Segoe UI, sans-serif;
      white-space: nowrap;
      box-shadow: 0 1px 3px rgba(0,0,0,.45);
      pointer-events: auto;
      cursor: pointer;
    }
    .name-tag.active { outline: 2px solid #fff; }
    .leaflet-tooltip.name-tip {
      background: transparent; border: 0; box-shadow: none; padding: 0; margin: 0;
    }
    .leaflet-tooltip.name-tip::before { display: none; }
  </style>
</head>
<body>
  <div id="app">
    <aside id="side">
      <header>
        <h1>Find your mosque</h1>
        <p>Click a name on the map or list. Double-click to confirm.</p>
      </header>
      <div class="search-row">
        <input id="q" type="search" placeholder="Filter by name or city…" />
        <button id="searchBtn" type="button">Filter</button>
      </div>
      <div class="actions">
        <button id="locBtn" type="button">My location</button>
        <button id="refreshBtn" type="button">Refresh map</button>
      </div>
      <div id="status">Starting…</div>
      <div id="confirm">
        <div class="picked" id="pickedLabel">No mosque selected</div>
        <button id="useBtn" type="button" disabled>Use selected mosque</button>
      </div>
      <div id="list"></div>
    </aside>
    <div id="map"></div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
