[package]
name = "mawaqit-widget"
version = "0.1.7"
edition = "2021"
description = "Mawaqit Widget — Awqat Salaat–inspired Windows taskbar prayer times"
license = "MIT"

[[bin]]
name = "mawaqit-widget"
path = "src/main.rs"

[[bin]]
name = "widget"
path = "src/bin/widget.rs"

[[example]]
name = "open_map_picker"
path = "examples/open_map_picker.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde", "clock"] }
eframe = { version = "0.31", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.31"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tray-icon = "0.19"
directories = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
tao = "0.30"
wry = "0.48"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_Security",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
